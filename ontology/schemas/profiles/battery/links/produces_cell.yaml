# [DEPRECATED] PRODUCES_CELL Link Type
#
# Roll -> Cell 직결 관계는 전극 Lot 단계를 건너뛰므로 사용하지 않는다.
# 실제 계보는 다음과 같이 두 단계로 나뉘며, 중간에 좌표계가 바뀐다.
#
#   Roll --PRODUCES_LOT--> ElectrodeLot --SUPPLIES_CELL--> Cell
#        (position 구간)                 (양극/음극 각각 수렴)
#
# 직결 관계를 쓰면
#   - 롤의 어느 구간이 원인인지 알 수 없고
#   - 셀에 양극/음극 롤이 각각 들어간다는 사실을 표현할 수 없다
#
# 대체: produces_lot.yaml + supplies_cell.yaml
# 기존 데이터 마이그레이션이 끝나면 이 파일은 삭제한다.

deprecated: true
replacedBy:
  - PRODUCES_LOT
  - SUPPLIES_CELL

# Roll -> Cell 관계
# Roll에서 Cell이 생산되는 관계

linkType: PRODUCES
version: "1.0.0"
description: "Roll에서 Cell을 생산하는 관계 (1:N)"

# 관계 방향
source:
  objectType: Roll
  cardinality: "1"

target:
  objectType: Cell
  cardinality: "N"

# 관계 속성
properties:
  cut_position_m:
    type: float
    description: "롤 내 절단 위치 (m)"
    required: false
    unit: "m"

  cut_time:
    type: datetime
    description: "절단 시간"
    required: false

  cut_equipment_id:
    type: string
    description: "절단 설비 ID"
    required: false

# 제약 조건
constraints:
  - type: referential
    description: "Cell의 source_roll_id는 Roll의 roll_id를 참조해야 함"
    rule: "Cell.source_roll_id = Roll.roll_id"

# 인덱스
indexes:
  - fields: [source_roll_id, cut_position_m]
    unique: false
