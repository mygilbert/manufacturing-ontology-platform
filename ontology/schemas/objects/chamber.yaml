# Chamber Object Type
# 설비를 구성하는 처리 모듈 (챔버)
#
# 왜 별도 객체인가
#   Equipment.chamber_count 처럼 숫자 속성으로만 두면
#   "EQP-001 챔버2를 지나간 Lot" / "챔버별 Cpk 비교" 같은 질의를 할 수 없다.
#   FDC 데이터는 대부분 챔버 단위로 수집되고 이상도 챔버 단위로 발생하므로,
#   챔버는 온톨로지의 1급 객체여야 한다.
#
# 참조 표준
#   - SEMI E120 (CEM): 설비는 Module / Subsystem / IODevice로 분해된다.
#     챔버는 Process Module에 해당한다.

objectType: Chamber
version: "1.0.0"
description: "설비를 구성하는 처리 모듈(챔버). SEMI E120의 Process Module에 대응"

standards:
  - id: SEMI-E120
    name: "Common Equipment Model (CEM)"
    appliesTo: "모듈 계층 구조 및 module_type 분류"

primaryKey: chamber_id

properties:
  chamber_id:
    type: string
    description: "챔버 고유 식별자 (설비 ID + 챔버 번호 조합 권장)"
    required: true
    indexed: true
    example: "EQP-ETCH-001.CH2"

  equipment_id:
    type: string
    description: "소속 설비 ID"
    required: true
    indexed: true
    example: "EQP-ETCH-001"

  chamber_no:
    type: string
    description: "설비 내 챔버 번호/이름 (소스 시스템이 기록하는 원본 값)"
    required: true
    example: "2"

  module_type:
    type: enum
    description: "SEMI E120 모듈 분류"
    required: true
    standard: SEMI-E120
    values:
      - PROCESS_MODULE    # 실제 공정이 일어나는 모듈 (챔버)
      - LOAD_PORT         # 로드포트
      - TRANSFER_MODULE   # 이송 모듈
      - ALIGNER           # 얼라이너
      - LOAD_LOCK         # 로드락
      - METROLOGY_MODULE  # 계측 모듈
      - OTHER
    default: "PROCESS_MODULE"

  status:
    type: enum
    description: "챔버 상태. 설비와 동일하게 SEMI E10 6상태를 따른다"
    required: false
    standard: SEMI-E10
    values:
      - PRODUCTIVE
      - STANDBY
      - ENGINEERING
      - SCHEDULED_DOWNTIME
      - UNSCHEDULED_DOWNTIME
      - NON_SCHEDULED

  last_pm_date:
    type: datetime
    description: "마지막 예방 정비 일자 (챔버 단위 PM 주기가 설비와 다른 경우가 많다)"
    required: false

  wafer_count_since_pm:
    type: integer
    description: "PM 이후 처리 매수. PM 직후 이상 발생 패턴 분석에 사용"
    required: false

outgoingLinks:
  - linkType: MEASURED_BY
    targetObject: Sensor
    description: "이 챔버를 관측하는 센서"

incomingLinks:
  - linkType: HAS_MODULE
    sourceObject: Equipment
    description: "이 챔버가 속한 설비"

  - linkType: PROCESSED_AT
    sourceObject: Lot
    description: "이 챔버에서 처리된 Lot"

indexes:
  - fields: [chamber_id]
    unique: true
  - fields: [equipment_id]
    unique: false
  - fields: [equipment_id, chamber_no]
    unique: true

# 데이터 소스 매핑 (레거시 시스템)
# TODO: 사내 실제 테이블/컬럼명으로 교체할 것
sourceMapping:
  fdc:
    table: "FDC_PARAM_VALUE"        # 챔버 마스터가 없으면 측정값에서 distinct로 도출
    keyColumn: "CHAMBER_ID"
    columnMapping:
      chamber_no: "CHAMBER_ID"
      equipment_id: "EQUIP_ID"
    note: >
      챔버 마스터 테이블이 별도로 없는 경우가 많다.
      그때는 FDC 측정값에서 (EQUIP_ID, CHAMBER_ID) 조합을 추출해 생성한다.
  mes:
    table: "MES_TRACK_IN_OUT"
    keyColumn: "CHAMBER_ID"
    columnMapping:
      chamber_no: "CHAMBER_ID"
      equipment_id: "EQP_ID"
    note: >
      MES가 챔버를 기록하지 않는 경우 PROCESSED_AT 관계에
      chamber_resolved: false 를 표시하고 챔버 단위 분석에서 제외한다.
