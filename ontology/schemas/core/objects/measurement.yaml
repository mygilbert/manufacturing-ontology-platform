# Measurement Object Type
# 측정값을 나타내는 온톨로지 객체 (FDC, SPC 데이터)
#
# [중요] 저장 위치에 대한 원칙
#   Measurement는 그래프(Apache AGE)에 노드로 적재하지 않는다.
#   FDC 측정값은 설비 1대당 하루 수백만 건 규모라 그래프에 넣으면
#   노드 수가 폭발하고 AGE가 버티지 못한다.
#
#   그래프에는 "무엇이 무엇과 어떻게 연결되는가"(Equipment/Chamber/Lot/Sensor와
#   그 관계)만 담고, 측정값 자체는 TimescaleDB 하이퍼테이블에 두고
#   (sensor_id, equipment_module_id, timestamp) 키로 참조한다.
#
#   이 스키마는 TimescaleDB 테이블의 논리 모델이자 그래프와의 연결 규약이다.
#
# 참조 표준
#   - W3C SSN/SOSA: 이 객체는 sosa:Observation에 대응한다.
#     센서(Sensor), 관측 물리량(observed_property), 관측 대상(Chamber)은
#     각각 별도 객체/속성으로 분리되어 있다. sensor.yaml 참조.

objectType: Measurement
version: "2.0.0"
description: "공정 측정값 (FDC 센서 데이터, SPC 품질 데이터). SOSA:Observation에 대응"

standards:
  - id: W3C-SOSA
    name: "Sensor, Observation, Sample, and Actuator"
    appliesTo: "관측 1건의 구조"

# 저장 위치 선언 (그래프 적재 금지)
storage:
  primary: timescaledb
  table: fdc_measurements
  graphNode: false
  graphReference:
    note: >
      그래프에서는 Sensor -> OBSERVES -> Chamber 경로로 접근하고,
      실제 값은 TimescaleDB에서 (sensor_id, timestamp) 범위 질의로 가져온다.

# SOSA 용어 매핑
sosaMapping:
  class: "sosa:Observation"
  properties:
    sensor_id: "sosa:madeBySensor"
    observed_property: "sosa:observedProperty"
    equipment_module_id: "sosa:hasFeatureOfInterest"
    timestamp: "sosa:resultTime"
    value: "sosa:hasSimpleResult"

# 기본 키 (복합 키)
primaryKey: measurement_id
compositeKey: [equipment_id, produced_unit_id, param_id, timestamp]

# 속성 정의
properties:
  measurement_id:
    type: string
    description: "측정 고유 식별자"
    required: true
    indexed: true

  source_system:
    type: enum
    description: "데이터 소스 시스템"
    required: true
    values:
      - FDC          # Fault Detection & Classification
      - SPC          # Statistical Process Control
      - METROLOGY    # 계측 장비
      - INLINE       # 인라인 검사
    example: "FDC"

  sensor_id:
    type: string
    description: "관측을 수행한 센서 ID (sosa:madeBySensor). sensor.yaml 참조"
    required: true
    indexed: true
    example: "COATER-01.LANE2.THICKNESS"

  observed_property:
    type: string
    description: >
      관측 물리량의 정규화된 이름 (sosa:observedProperty).
      param_id는 벤더별로 다르므로, 설비 간 비교는 이 값으로 한다.
    required: true
    indexed: true
    example: "coating_thickness"

  equipment_module_id:
    type: string
    description: "관측 대상 설비 모듈 ID (sosa:hasFeatureOfInterest)"
    required: false
    indexed: true

  equipment_id:
    type: string
    description: "측정 설비 ID"
    required: true
    indexed: true

  produced_unit_id:
    type: string
    description: >
      측정 대상 생산 단위 ID. 도메인별로 의미가 다르다.
      배터리: Cell / ElectrodeLot,  반도체: Wafer
    required: false
    indexed: true

  lot_id:
    type: string
    description: "측정 대상 Lot ID"
    required: false
    indexed: true

  process_id:
    type: string
    description: "공정 ID"
    required: true
    indexed: true

  recipe_id:
    type: string
    description: "레시피 ID"
    required: false

  param_id:
    type: string
    description: "파라미터 ID"
    required: true
    indexed: true
    example: "CHAMBER_PRESSURE"

  param_name:
    type: string
    description: "파라미터 이름"
    required: true
    example: "Chamber Pressure"

  value:
    type: float
    description: "측정값"
    required: true

  unit:
    type: string
    description: "단위"
    required: true
    example: "mTorr"

  timestamp:
    type: datetime
    description: "측정 시간"
    required: true
    indexed: true

  # 규격/관리 한계
  usl:
    type: float
    description: "상한 규격"
    required: false

  lsl:
    type: float
    description: "하한 규격"
    required: false

  ucl:
    type: float
    description: "상한 관리 한계"
    required: false

  lcl:
    type: float
    description: "하한 관리 한계"
    required: false

  target:
    type: float
    description: "목표값"
    required: false

  # 상태 판정
  status:
    type: enum
    description: "측정 결과 상태"
    required: false
    values:
      - NORMAL       # 정상
      - WARNING      # 경고 (관리한계 초과)
      - ALARM        # 알람 (규격한계 초과)
      - OUTLIER      # 이상치
    default: "NORMAL"

  # 통계 정보 (배치/윈도우 집계 시)
  statistics:
    type: object
    description: "통계 정보"
    required: false
    properties:
      mean:
        type: float
        description: "평균"
      std:
        type: float
        description: "표준편차"
      min:
        type: float
        description: "최소값"
      max:
        type: float
        description: "최대값"
      cp:
        type: float
        description: "공정능력지수 Cp"
      cpk:
        type: float
        description: "공정능력지수 Cpk"

  # 샘플 정보
  sample_count:
    type: integer
    description: "샘플 수"
    required: false
    default: 1

  site_id:
    type: string
    description: "측정 사이트 ID (생산 단위 내 위치)"
    required: false

# 관계 정의
outgoingLinks:
  - linkType: MEASURED_ON
    targetObject: Equipment
    description: "측정이 수행된 설비"

  - linkType: MEASURED_FOR
    targetObject: ProducedUnit   # 프로파일에서 구체화 (Cell / Wafer)
    description: "측정 대상 생산 단위"

  - linkType: PART_OF_PROCESS
    targetObject: Process
    description: "해당 공정"

incomingLinks:
  - linkType: TRIGGERED
    sourceObject: Alarm
    description: "이 측정으로 발생한 알람"

# 파티셔닝 (시계열 최적화)
partitioning:
  enabled: true
  key: timestamp
  interval: "1 day"
  retention: "90 days"

# 인덱스
indexes:
  - fields: [measurement_id]
    unique: true
  - fields: [equipment_id, param_id, timestamp]
    unique: false
  - fields: [produced_unit_id, timestamp]
    unique: false
  - fields: [process_id, param_id, timestamp]
    unique: false
  - fields: [status, timestamp]
    unique: false

# 데이터 소스 매핑
sourceMapping:
  fdc:
    table: "FDC_PARAM_VALUE"
    keyColumn: "VALUE_ID"
    columnMapping:
      measurement_id: "VALUE_ID"
      equipment_id: "EQUIP_ID"
      produced_unit_id: "WAFER_ID"
      lot_id: "LOT_ID"
      param_id: "PARAM_ID"
      param_name: "PARAM_NAME"
      value: "PARAM_VALUE"
      unit: "PARAM_UNIT"
      timestamp: "COLLECT_TIME"
      usl: "USL"
      lsl: "LSL"
  spc:
    table: "SPC_MEASUREMENT"
    keyColumn: "MEAS_ID"
    columnMapping:
      measurement_id: "MEAS_ID"
      equipment_id: "EQUIP_ID"
      produced_unit_id: "WAFER_ID"
      process_id: "PROCESS_ID"
      param_id: "ITEM_ID"
      param_name: "ITEM_NAME"
      value: "MEAS_VALUE"
      unit: "UNIT"
      timestamp: "MEAS_TIME"
      ucl: "UCL"
      lcl: "LCL"
      target: "TARGET"
