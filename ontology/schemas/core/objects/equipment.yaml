# Equipment Object Type
# 설비/장비를 나타내는 온톨로지 객체 (도메인 무관 코어)
#
# 참조 표준
#   - ISA-95 / IEC 62264: Equipment는 Work Unit 계층에 대응한다
#   - ISO 22400-2: status 의 각 상태가 OEE 산출용 시간 요소에 대응한다
#   - AAS (Asset Administration Shell): 설비 자산의 디지털 표현
#
# 설비 타입(type) enum은 도메인마다 다르므로 프로파일에서 정의한다.
#   배터리: ontology/schemas/profiles/battery/
#   반도체: ontology/schemas/profiles/semiconductor/
#
# [이전 버전 주의] v2.0.0 은 SEMI E10 을 준거로 삼았다. SEMI 표준은
# 반도체 전용이므로 배터리 도메인에는 맞지 않는다. 6상태 모델 자체는
# 업계 공통으로 쓸 만하므로 유지하되, 준거를 ISO 22400 시간 요소로 옮겼다.

objectType: Equipment
version: "3.0.0"
description: "제조 공정에서 사용되는 설비/장비를 나타냅니다"

# 준거 표준
standards:
  - id: ISO-22400-2
    name: "KPIs for manufacturing operations management"
    appliesTo: "status 상태와 OEE 시간 요소 매핑"
  - id: ISA-95
    name: "IEC 62264 Enterprise-Control Integration"
    appliesTo: "설비 계층 (Enterprise/Site/Area/WorkCenter/WorkUnit)"
  - id: AAS
    name: "Asset Administration Shell"
    appliesTo: "설비 자산 디지털 표현 (배터리 여권 연계)"

# 기본 키
primaryKey: equipment_id

# 속성 정의
properties:
  equipment_id:
    type: string
    description: "설비 고유 식별자"
    required: true
    indexed: true
    example: "EQP-ETCH-001"

  name:
    type: string
    description: "설비 이름"
    required: true
    example: "Etcher-01"

  type:
    type: string
    description: >
      설비 유형. 허용값은 도메인 프로파일에서 정의한다.
      배터리:  MIXER / COATER / DRYER / CALENDER / SLITTER / NOTCHER /
               STACKER / WINDER / WELDER / FILLER / FORMATION / AGING / EOL_TESTER
      반도체:  DRY_ETCH / CVD / PVD / LITHO / CMP / DIFFUSION / ...
    required: true
    indexed: true
    example: "COATER"

  domain_profile:
    type: enum
    description: "이 설비가 속한 도메인 프로파일"
    required: true
    values:
      - battery
      - semiconductor
    default: "battery"

  status:
    type: enum
    description: >
      설비 상태. 6상태 모델은 SEMI E10 에서 비롯했으나 업계 공통으로 통용된다.
      각 상태가 ISO 22400 의 어느 시간 요소로 집계되는지를 함께 정의해
      가동률/OEE 가 사내 기존 집계와 맞물리도록 한다.

      자체 용어(RUNNING/IDLE/PM/DOWN)를 쓰면 기존 리포트와 수치가 어긋나
      "어느 쪽이 맞느냐"는 논쟁이 반드시 생긴다.
    required: true
    standard: ISO-22400-2
    values:
      - PRODUCTIVE            # 의도된 기능 수행 중 (정규 생산, 재작업, 생산테스트)
      - STANDBY               # 수행 가능하나 미가동 (작업자/자재/지원도구 대기)
      - ENGINEERING           # 엔지니어링 실험 수행 중
      - SCHEDULED_DOWNTIME    # 계획된 비가동 (예방정비 등)
      - UNSCHEDULED_DOWNTIME  # 계획되지 않은 비가동 (고장, 긴급정비)
      - NON_SCHEDULED         # 비조업 시간 (미배정 교대, 셧다운)
    default: "STANDBY"

    # ISO 22400 시간 요소 매핑 (OEE 산출 입력)
    #   APT  = Actual Production Time      (가동 시간)
    #   ADET = Actual Delay Time           (지연 시간)
    #   ADOT = Actual Down Time            (비가동 시간)
    #   PBT  = Planned Busy Time 에 미포함  (비조업)
    iso22400Mapping:
      PRODUCTIVE: APT
      STANDBY: ADET
      ENGINEERING: ADET
      SCHEDULED_DOWNTIME: ADOT
      UNSCHEDULED_DOWNTIME: ADOT
      NON_SCHEDULED: NOT_IN_PBT

    # 기존 자체 코드 -> 표준 상태 매핑 (레거시 데이터 적재 시 사용)
    legacyMapping:
      RUNNING: PRODUCTIVE
      IDLE: STANDBY
      PM: SCHEDULED_DOWNTIME
      DOWN: UNSCHEDULED_DOWNTIME
      ENGINEERING: ENGINEERING

  substate:
    type: string
    description: >
      E10 기본상태 하위의 사내 세부 사유 코드.
      기본상태는 표준으로 고정하고, 사내 고유 구분은 여기에 담는다.
      (이전 이름: e10_substate)
    required: false
    example: "WAIT_OPERATOR"

  location:
    type: string
    description: "설비 위치 (FAB-ZONE 형식)"
    required: true
    example: "FAB1-ZONE2"

  manufacturer:
    type: string
    description: "설비 제조사"
    required: false
    example: "Applied Materials"

  model:
    type: string
    description: "설비 모델명"
    required: false
    example: "Centura 5200"

  install_date:
    type: datetime
    description: "설치 일자"
    required: false

  last_pm_date:
    type: datetime
    description: "마지막 예방 정비 일자"
    required: false

  chamber_count:
    type: integer
    description: "챔버 수"
    required: false
    default: 1

  capabilities:
    type: array
    items:
      type: string
    description: "설비가 지원하는 공정 목록"
    required: false
    example: ["OXIDE_ETCH", "POLY_ETCH", "METAL_ETCH"]

# 시계열 데이터
# 실제 파라미터 목록은 도메인 프로파일과 사이트 설정에서 정의한다.
# (센서/관측 모델은 core/objects/sensor.yaml 참조)
timeseries:
  enabled: true
  parametersDefinedIn: "profiles/<domain>/ + config/site/"

# 관계 정의 (이 객체에서 나가는 관계)
outgoingLinks:
  - linkType: HAS_MODULE
    targetObject: Chamber
    description: >
      이 설비를 구성하는 챔버/모듈 (SEMI E120 계층).
      chamber_count 속성만으로는 "어느 챔버에서 무슨 일이 있었는가"를 질의할 수 없어
      챔버를 독립 객체로 분리한다.

  - linkType: PROCESSED_LOT
    targetObject: Lot
    description: "이 설비에서 처리한 Lot"

  - linkType: GENERATED_ALARM
    targetObject: Alarm
    description: "이 설비에서 발생한 알람"

  - linkType: USES_RECIPE
    targetObject: Recipe
    description: "이 설비에서 사용하는 레시피"

# 관계 정의 (이 객체로 들어오는 관계)
incomingLinks:
  - linkType: LOCATED_IN
    sourceObject: Process
    description: "이 설비가 속한 공정"

# 인덱스 설정
indexes:
  - fields: [equipment_id]
    unique: true
  - fields: [type, status]
    unique: false
  - fields: [location]
    unique: false

# 데이터 소스 매핑 (레거시 시스템)
sourceMapping:
  fdc:
    table: "FDC_EQUIPMENT_MASTER"
    keyColumn: "EQUIP_ID"
    columnMapping:
      equipment_id: "EQUIP_ID"
      name: "EQUIP_NAME"
      type: "EQUIP_TYPE"
      status: "EQUIP_STATUS"
      location: "EQUIP_LOCATION"
  mes:
    table: "MES_EQUIPMENT"
    keyColumn: "EQP_ID"
    columnMapping:
      equipment_id: "EQP_ID"
      name: "EQP_NAME"
      manufacturer: "VENDOR"
      model: "MODEL_NO"
